name: CoGen Workflow

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: true
      - name: Install gitleaks
        run: make gitleaks-install
      - name: Run gitleaks secret scan
        run: make gitleaks

  changes:
    name: Detect which workflow should run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute changed source groups
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          backend="false"
          frontend="false"
          if git diff --name-only "$base" HEAD > /tmp/cogen-changed.txt 2>/dev/null; then
            while IFS= read -r file || [ -n "$file" ]; do
              case "$file" in
                src/*|config/*|migrations/*|Makefile) backend="true" ;;
              esac
              case "$file" in
                frontend/*|Makefile) frontend="true" ;;
              esac
            done < /tmp/cogen-changed.txt
          else
            backend="true"
            frontend="true"
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend build, checks, and Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [gitleaks, changes]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: true
      - name: Build build/analysis
        run: make build
      - name: Build maintained Go tools
        run: make tools
      - name: Format check
        run: make format-check
      - name: Vet
        run: make vet
      - name: Unit tests
        run: make test-unit
      - name: Functional tests
        run: make test-functional
      - name: Integration tests
        run: make test-integration
      - name: Documentation tool tests
        run: make test-docs

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [gitleaks, changes]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: true
      - name: Run all Go tests with the race detector
        run: make test-race

  coverage:
    name: Coverage policy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: gitleaks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: true
      - name: Write atomic whole-module coverage and enforce the policy
        run: make coverage

  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: gitleaks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: true
      - name: Validate documentation links, format, catalog, migrations, and acknowledged state
        run: make check-docs

  frontend:
    name: Frontend build, checks, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [gitleaks, changes]
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: make frontend-install
      - name: Assemble frontend/dist
        run: make frontend-build
      - name: Class registry and TypeScript checks
        run: make check-frontend
      - name: Verify checked-in PDF.js assets
        run: make frontend-pdfjs-vendor-check
      - name: Frontend unit tests
        run: make test-frontend-unit

  frontend-browser-chromium:
    name: Playwright chromium
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [gitleaks, changes]
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: true
      - name: Install frontend dependencies
        run: make frontend-install
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Generate viewer fixture databases
        run: make fixture
      - name: Run viewer, review, and API-shape Playwright suites
        run: make test-frontend BROWSER=chromium TEST_FILE="tests/viewer.spec.ts tests/review.spec.ts tests/api-shapes.spec.ts"

  frontend-browser-firefox:
    name: Playwright firefox
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [gitleaks, changes]
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: true
      - name: Install frontend dependencies
        run: make frontend-install
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-firefox-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Playwright browser
        run: npx playwright install --with-deps firefox
        working-directory: frontend
      - name: Generate viewer fixture databases
        run: make fixture
      - name: Run viewer, review, and API-shape Playwright suites
        run: make test-frontend BROWSER=firefox TEST_FILE="tests/viewer.spec.ts tests/review.spec.ts tests/api-shapes.spec.ts"

  e2e:
    name: Offline pipeline-to-viewer end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [gitleaks, changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: true
      - name: Install frontend dependencies
        run: make frontend-install
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run deterministic and mocked-provider E2E tests
        run: make test-e2e
