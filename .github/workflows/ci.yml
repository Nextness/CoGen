name: CoGen Workflow

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install gitleaks
        run: make gitleaks-install
      - name: Run gitleaks secret scan
        run: make gitleaks

  changes:
    name: Detect which workflow should run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute changed source groups
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          backend="false"
          frontend="false"
          if git diff --name-only "$base" HEAD > /tmp/cogen-changed.txt 2>/dev/null; then
            while IFS= read -r file || [ -n "$file" ]; do
              case "$file" in
                backend/*|internal/*|config/*|migrations/*|go.mod|go.sum|Makefile|.github/workflows/*|tests/backend/*|tests/shared/*|tests/support/*|tests/tooling/*|tests/contracts/*|tests/e2e/*|tooling/*) backend="true" ;;
              esac
              case "$file" in
                backend/*|internal/*|config/*|migrations/*|go.mod|go.sum|frontend/*|package.json|package-lock.json|Makefile|.github/workflows/*|tests/package.json|tests/tsconfig.json|tests/playwright.config.ts|tests/frontend/*|tests/support/*|tests/tooling/*|tests/contracts/*|tests/e2e/*|tooling/*) frontend="true" ;;
              esac
            done < /tmp/cogen-changed.txt
          else
            backend="true"
            frontend="true"
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend build, checks, and Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [gitleaks, changes]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned sqlc
        run: make sqlc-install
      - name: Verify generated sqlc output and query analysis
        run: make sqlc-check
      - name: Verify raw SQL ownership
        run: make check-sql
      - name: Verify import and transaction graph
        run: make check-imports
      - name: Build build/analysis
        run: make build
      - name: Build maintained Go tools
        run: make tools
      - name: Format check
        run: make format-check
      - name: Vet
        run: make vet
      - name: Unit tests
        run: make test-go LAYER=unit
      - name: Functional tests
        run: make test-go LAYER=functional
      - name: Integration tests
        run: make test-go LAYER=integration

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [gitleaks, changes]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run all Go tests with the race detector
        run: make test-race
        env:
          GOFLAGS: -p=2

  coverage:
    name: Coverage policy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: gitleaks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Write atomic whole-module coverage and enforce the policy
        run: make coverage

  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: gitleaks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate documentation links, format, catalog, migrations, and acknowledged state
        run: make check-docs

  frontend:
    name: Frontend and Node tooling build, checks, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [gitleaks, changes]
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install frontend dependencies
        run: make frontend-install
      - name: Assemble build/frontend/dist
        run: make frontend-build
      - name: Class registry and TypeScript checks
        run: make check-frontend
      - name: Verify checked-in PDF.js assets
        run: make frontend-pdfjs-vendor-check
      - name: Frontend unit tests
        run: make test-frontend-unit
      - name: Frontend functional tests
        run: make test-frontend-functional
      - name: Node tooling and harness tests
        run: npm run test:tooling --workspace @cogen/tests
      - name: PDF annotation contract tests
        run: make test DOMAIN=contracts COMPONENT=pdf LAYER=integration

  frontend-browser-chromium:
    name: Playwright chromium
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [gitleaks, changes]
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install frontend dependencies
        run: make frontend-install
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser
        run: npm exec --workspace tests -- playwright install --with-deps chromium
      - name: Generate viewer fixture databases
        run: make fixture
      - name: Run viewer and review Playwright suites
        run: make test-frontend BROWSER=chromium
      - name: Run HTTP contract Playwright suites
        run: make test DOMAIN=contracts LAYER=integration COMPONENT=http BROWSER=chromium
      - name: Run visual and accessibility assertions
        run: make test-frontend-visual

  frontend-browser-firefox:
    name: Playwright firefox
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [gitleaks, changes]
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install frontend dependencies
        run: make frontend-install
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-firefox-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser
        run: npm exec --workspace tests -- playwright install --with-deps firefox
      - name: Generate viewer fixture databases
        run: make fixture
      - name: Run viewer and review Playwright suites
        run: make test-frontend BROWSER=firefox
      - name: Run HTTP contract Playwright suites
        run: make test DOMAIN=contracts LAYER=integration COMPONENT=http BROWSER=firefox

  e2e:
    name: Offline pipeline-to-viewer end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [gitleaks, changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install frontend dependencies
        run: make frontend-install
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npm exec --workspace tests -- playwright install --with-deps chromium
      - name: Run deterministic and mocked-provider E2E tests
        run: make test-e2e
