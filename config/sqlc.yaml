# Family-local sqlc inputs for typed query generation.
# This configuration is code generation only: it never feeds runtime migrations
# or SOMETHING database versioning. Paths resolve relative to this file, so run
# every command from the repository root with -f config/sqlc.yaml.
# Add one SQLite generation block per table family as its schema and query
# files land under src/database/<family>/schema/.
version: "2"
sql:
  - engine: "sqlite"
    schema: "../src/database/cache/schema/definitions.sql"
    queries:
      - "../src/database/cache/schema/cache.sql"
      - "../src/database/cache/schema/cache_use.sql"
    gen:
      go:
        package: "sql"
        out: "../src/database/cache/internal/sql"
        sql_package: "database/sql"
        emit_json_tags: false
        emit_prepared_queries: false
        emit_exported_queries: false
        emit_interface: false
        omit_unused_structs: true
  - engine: "sqlite"
    schema: "../src/database/search/schema/definitions.sql"
    queries:
      - "../src/database/search/schema/search.sql"
      - "../src/database/search/schema/revisions.sql"
      - "../src/database/search/schema/plans.sql"
    gen:
      go:
        package: "sql"
        out: "../src/database/search/internal/sql"
        sql_package: "database/sql"
        emit_json_tags: false
        emit_prepared_queries: false
        emit_exported_queries: false
        emit_interface: false
        omit_unused_structs: true
  - engine: "sqlite"
    schema: "../src/database/run/schema/definitions.sql"
    queries:
      - "../src/database/run/schema/run.sql"
      - "../src/database/run/schema/lifecycle.sql"
      - "../src/database/run/schema/reviewer.sql"
      - "../src/database/run/schema/step.sql"
      - "../src/database/run/schema/metric.sql"
      - "../src/database/run/schema/overview.sql"
      - "../src/database/run/schema/audit.sql"
    gen:
      go:
        package: "sql"
        out: "../src/database/run/internal/sql"
        sql_package: "database/sql"
        emit_json_tags: false
        emit_prepared_queries: false
        emit_exported_queries: false
        emit_interface: false
        omit_unused_structs: true
  - engine: "sqlite"
    schema: "../src/database/source/schema/definitions.sql"
    queries:
      - "../src/database/source/schema/source.sql"
      - "../src/database/source/schema/record.sql"
      - "../src/database/source/schema/filter_count.sql"
    gen:
      go:
        package: "sql"
        out: "../src/database/source/internal/sql"
        sql_package: "database/sql"
        emit_json_tags: false
        emit_prepared_queries: false
        emit_exported_queries: false
        emit_interface: false
        omit_unused_structs: true
  - engine: "sqlite"
    schema: "../src/database/artifact/schema/definitions.sql"
    queries:
      - "../src/database/artifact/schema/artifact.sql"
      - "../src/database/artifact/schema/blob.sql"
      - "../src/database/artifact/schema/run_artifact.sql"
      - "../src/database/artifact/schema/relationships.sql"
    gen:
      go:
        package: "sql"
        out: "../src/database/artifact/internal/sql"
        sql_package: "database/sql"
        emit_json_tags: false
        emit_prepared_queries: false
        emit_exported_queries: false
        emit_interface: false
        omit_unused_structs: true
  - engine: "sqlite"
    schema: "../src/database/sqlcprobe/schema/definitions.sql"
    queries:
      - "../src/database/sqlcprobe/schema/probe.sql"
    gen:
      go:
