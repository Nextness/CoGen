<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Keep browser text and canvas labels independent of the Linux host's fonts. -->
  <dir prefix="relative">../../../frontend/vendor/pdfjs/standard_fonts</dir>
  <dir prefix="relative">.</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias>
    <family>system-ui</family>
    <prefer><family>Liberation Sans</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>ui-sans-serif</family>
    <prefer><family>Liberation Sans</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Liberation Mono</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>ui-monospace</family>
    <prefer><family>Liberation Mono</family><family>DejaVu Sans</family></prefer>
  </alias>
</fontconfig>
